<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>抖音视频屏蔽</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header>
      <h1>抖音视频屏蔽</h1>
      <label class="switch">
        <input type="checkbox" id="enabled" />
        <span class="slider"></span>
      </label>
    </header>

    <main>
      <section>
        <div class="section-head">
          <h2>已屏蔽</h2>
          <button id="clearBlocked" class="ghost small">清空</button>
        </div>
        <div id="blockedList" class="list"></div>
        <p id="blockedEmpty" class="empty">暂无屏蔽项。</p>
      </section>

      <section>
        <h2>手动添加</h2>
        <div class="manual-row">
          <select id="manualType" aria-label="屏蔽类型">
            <option value="music">音乐</option>
            <option value="author">博主</option>
            <option value="tag">标签完全匹配</option>
            <option value="tagKeyword">标签包含关键词</option>
          </select>
          <input
            id="manualInput"
            type="text"
            aria-label="屏蔽内容"
            aria-describedby="manualHelp"
            placeholder="输入 ID、标题、昵称或标签"
          />
          <button id="manualAdd">添加</button>
        </div>
        <p id="manualHelp" class="empty">选「标签包含关键词」，例如输入“穿搭”，即可屏蔽 #夏日穿搭、#日常穿搭。只匹配标签，不匹配正文；多个关键词请分别添加。</p>
      </section>

      <section>
        <div class="section-head">
          <h2>屏蔽记录</h2>
          <button id="clearHistory" class="ghost small">清空</button>
        </div>
        <div id="historyList" class="list"></div>
        <p id="historyEmpty" class="empty">暂无屏蔽记录。</p>
      </section>

      <section>
        <h2>按钮样式</h2>
        <div class="icon-uploader">
          <div
            id="iconPreviewBox"
            class="icon-preview"
            role="button"
            tabindex="0"
            aria-label="上传按钮图标"
          >
            <img id="iconPreview" alt="图标预览" />
            <span id="iconPreviewText">默认</span>
          </div>
          <div class="icon-help">
            <strong>点击图片上传</strong>
            <span>自动缩放到最大 64px，保持比例</span>
          </div>
          <button id="clearIcon" class="ghost small">恢复默认</button>
        </div>
        <input id="iconFile" type="file" accept="image/*" hidden />
        <div class="style-row">
          <label for="buttonSize">大小</label>
          <input id="buttonSize" type="range" min="32" max="56" step="2" />
          <span id="buttonSizeValue">40px</span>
        </div>
      </section>

      <nav class="page-links" aria-label="管理工具">
        <a href="diagnostics.html">诊断</a>
        <a href="backup.html">备份与恢复</a>
      </nav>
    </main>

    <script src="popup.js"></script>
  </body>
</html>
