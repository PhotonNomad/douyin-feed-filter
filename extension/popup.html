<!doctype html>
<html lang="zh-CN" style="background:#f4f6f8">
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light" />
    <title>抖音视频屏蔽</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body class="popup">
    <header>
      <h1>抖音视频屏蔽</h1>
      <label class="switch">
        <input type="checkbox" id="enabled" />
        <span class="slider"></span>
      </label>
    </header>

    <main>
      <section>
        <div class="section-head">
          <h2>已屏蔽</h2>
          <button id="clearBlocked" class="ghost small">清空</button>
        </div>
        <div id="blockedList" class="list"></div>
        <p id="blockedEmpty" class="empty" hidden>暂无屏蔽项。</p>
      </section>

      <section>
        <h2>手动添加</h2>
        <div class="manual-row">
          <select id="manualType" aria-label="屏蔽类型">
            <option value="music">音乐</option>
            <option value="author">博主</option>
            <option value="tag">标签</option>
          </select>
          <input
            id="manualInput"
            type="text"
            aria-label="屏蔽内容"
            placeholder="输入 ID、标题、昵称或标签"
          />
          <button id="manualAdd">添加</button>
        </div>
      </section>

      <section>
        <div class="section-head">
          <h2>屏蔽记录</h2>
          <button id="clearHistory" class="ghost small">清空</button>
        </div>
        <div id="historyList" class="list"></div>
        <p id="historyEmpty" class="empty" hidden>暂无屏蔽记录。</p>
      </section>

      <nav class="page-links" aria-label="管理工具">
        <a href="diagnostics.html">诊断</a>
        <a href="backup.html">备份与恢复</a>
      </nav>
    </main>

    <script src="rules.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
